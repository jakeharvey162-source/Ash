name: Peak Jarvis Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/peak-jarvis-audit.mjs"
      - "supabase/functions/jarvis-ai-gateway/**"
      - ".github/workflows/peak-jarvis-audit.yml"

permissions:
  contents: read

jobs:
  peak:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run production Jarvis-grade audit
        env:
          ASH_LIVE_URL: https://meet-ash.jakeharvey162.workers.dev/
        run: node scripts/peak-jarvis-audit.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peak-jarvis-audit
          path: |
            peak-jarvis-audit.json
            peak-jarvis-audit.png
            peak-jarvis-audit-failure.png
          if-no-files-found: warn
