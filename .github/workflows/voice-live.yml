name: Ash Voice Live

# Targeted runs stay available here. Automatic provider-heavy checks are
# serialized in release-gate.yml to avoid quota storms and false 503 failures.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test live voice generation
        run: node scripts/voice-live-smoke.mjs
