name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "icons/**"
      - "index.html"
      - "package.json"
      - "capacitor.config.ts"
      - "manifest.webmanifest"
      - "native/android/**"
      - "scripts/patch-android-native.mjs"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web bundle
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync native project
        run: npx cap sync android

      - name: Add Ash native wake service
        run: node scripts/patch-android-native.mjs

      - name: Build APK and AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleDebug

      - name: Verify Android artifacts
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          test -s android/app/build/outputs/bundle/debug/app-debug.aab

      - name: Enforce compact Android size
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          AAB=android/app/build/outputs/bundle/debug/app-debug.aab
          APK_SIZE=$(stat -c%s "$APK")
          AAB_SIZE=$(stat -c%s "$AAB")
          echo "Debug APK: $((APK_SIZE / 1024 / 1024)) MB"
          echo "Debug AAB: $((AAB_SIZE / 1024 / 1024)) MB"
          test "$APK_SIZE" -le $((25 * 1024 * 1024)) || { echo "::error::Android APK exceeds 25 MB"; exit 1; }
          test "$AAB_SIZE" -le $((25 * 1024 * 1024)) || { echo "::error::Android AAB exceeds 25 MB"; exit 1; }

      - name: Upload Android release candidates
        uses: actions/upload-artifact@v4
        with:
          name: ash-android-installers
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
