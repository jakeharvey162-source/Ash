name: Ash Live Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "vercel.json"
      - "scripts/*.mjs"
      - "supabase/functions/**"
      - ".github/workflows/live-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install app and Playwright
        run: |
          npm install --no-audit --no-fund
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Build local Ash
        run: npm run build
      - name: Start local preview
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/ash-vite.log 2>&1 &
          echo $! > /tmp/ash-vite.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/ash-vite.log
          exit 1
      - name: Test authentication UI
        run: node scripts/auth-smoke.mjs
      - name: Test signed-in Ash UI
        run: node scripts/signed-in-smoke.mjs
      - name: Smoke test Cloudflare deployment
        env:
          ASH_DEPLOY_URL: https://meet-ash.jakeharvey162.workers.dev/
        run: node scripts/deployment-smoke.mjs
      - name: Smoke test Vercel deployment
        env:
          ASH_DEPLOY_URL: https://ash-f4.vercel.app/
        run: node scripts/deployment-smoke.mjs
      - name: Test production Worker auth end to end
        env:
          ASH_LIVE_URL: https://meet-ash.jakeharvey162.workers.dev/
        run: node scripts/worker-auth-e2e.mjs
      - name: Audit live Ash
        env:
          ASH_LIVE_URL: https://meet-ash.jakeharvey162.workers.dev/
        run: node scripts/live-audit.mjs
      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: ash-live-audit
          path: |
            live-audit.json
            audit-desktop.png
            audit-mobile.png
            signed-in-smoke.png
            worker-auth-e2e.json
            worker-auth-*.png
          if-no-files-found: error
