name: Ash Quality

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Test browser builder
        run: npm run test:builder
      - name: Build web app
        run: npm run build
      - name: Install desktop worker dependencies
        run: pip install -r desktop_worker/requirements.txt
      - name: Compile Python specialist
        run: |
          python -m py_compile desktop_worker/build_version.py
          python -m py_compile desktop_worker/agent_kernel.py
          python -m py_compile desktop_worker/agent_runtime.py
          python -m py_compile desktop_worker/local_scheduler.py
          python -m py_compile desktop_worker/openjarvis_bridge.py
          python -m py_compile desktop_worker/ash_agent.py
          python -m py_compile desktop_worker/offline_brain.py
          python -m py_compile desktop_worker/remote_worker.py
          python -m py_compile desktop_worker/site_reference.py
          python -m py_compile desktop_worker/worker_entry.py
          python -m py_compile desktop_worker/voice_entry.py
          python -m py_compile desktop_worker/ash_companion.py
          python -m py_compile desktop_worker/companion_overlay.py
          python -m py_compile desktop_worker/computer_control.py
          python -m py_compile desktop_worker/voice_runtime/__init__.py
          python -m py_compile desktop_worker/voice_runtime/events.py
          python -m py_compile desktop_worker/voice_runtime/wake.py
          python -m py_compile desktop_worker/voice_runtime/claude_cli.py
          python -m py_compile desktop_worker/voice_runtime/listener.py
          python -m py_compile desktop_worker/voice_runtime/windows_speech.py
          python -m py_compile desktop_worker/voice_runtime/lite_runtime.py
          python -m py_compile desktop_worker/voice_lite_entry.py
          python -m py_compile desktop_worker/voice_runtime/runtime.py
      - name: Test local voice and builder helpers
        run: PYTHONPATH=desktop_worker python -m unittest desktop_worker/test_agent_kernel.py desktop_worker/test_agent_runtime.py desktop_worker/test_openjarvis_bridge.py desktop_worker/test_local_scheduler.py desktop_worker/test_voice_runtime.py desktop_worker/test_builder.py desktop_worker/test_offline_brain.py desktop_worker/test_remote_worker.py desktop_worker/test_site_reference.py desktop_worker/test_computer_control.py desktop_worker/test_companion.py
      - name: Check public config exists
        run: test -f dist/config.js
