name: Ash Feature Verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install desktop test dependencies
        run: pip install -r desktop_worker/requirements.txt
      - name: Python desktop tests
        run: PYTHONPATH=desktop_worker python -m unittest discover -s desktop_worker -p 'test_*.py'
      - name: Local source and UI regression tests
        run: node --test tests/exact-reply.test.mjs tests/intelligence-view.test.mjs tests/business-desk.test.mjs
      - name: Build web
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Browser test actual client website job submission
        run: |
          npx playwright install --with-deps chromium
          node scripts/business-desk-browser-acceptance.mjs
      - name: Verify Deque axe-core accessibility test adapter
        run: |
          npm install --no-save --no-audit --no-fund playwright @axe-core/playwright@4.13.0
          node --input-type=module -e "import AxeBuilder from '@axe-core/playwright'; if(typeof AxeBuilder !== 'function') process.exit(1); console.log('AxeBuilder import verified');"
