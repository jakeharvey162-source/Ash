name: Ash Feature Verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python desktop tests
        run: PYTHONPATH=desktop_worker python -m unittest discover -s desktop_worker -p 'test_*.py'
      - name: Exact reply tests
        run: node --test tests/exact-reply.test.mjs
      - name: Build web
        run: |
          npm install --no-audit --no-fund
          npm run build
