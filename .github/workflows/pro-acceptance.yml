name: Ash Pro Acceptance

# Targeted runs stay available here. Automatic provider-heavy checks are
# serialized in release-gate.yml to avoid quota storms and false 503 failures.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run live pro acceptance
        env:
          ASH_LIVE_URL: https://meet-ash.jakeharvey162.workers.dev/
        run: node scripts/pro-acceptance-live.mjs
