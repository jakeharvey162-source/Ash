name: Ash Computer Control Live

# Targeted runs stay available here. Automatic provider-heavy checks are
# serialized in release-gate.yml to avoid quota storms and false 503 failures.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r desktop_worker/requirements.txt
          pip install Pillow
      - name: Run screenshot-plan-action acceptance
        env:
          ASH_LIVE_URL: https://meet-ash.jakeharvey162.workers.dev/
        run: python scripts/computer-control-live.py
