name: Ash Wake Rename Live

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/wake-name-live.mjs"
      - ".github/workflows/wake-name-live.yml"
      - "src/**"
      - "supabase/functions/jarvis-ai-gateway/**"
      - "supabase/functions/ash-device-link/**"

permissions:
  contents: read

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test rename and wake behavior in production
        env:
          ASH_LIVE_URL: https://meet-ash.jakeharvey162.workers.dev/
        run: node scripts/wake-name-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wake-name-live
          path: wake-name-acceptance.png
          if-no-files-found: ignore
