name: Ash Builder Pro Quality

# Targeted runs stay available here. Automatic provider-heavy checks are
# serialized in release-gate.yml to avoid quota storms and false 503 failures.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  builder:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Builder dependencies
        run: |
          pip install -r desktop_worker/requirements.txt
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Pair CI as a real Ash desktop
        env:
          ASH_LIVE_URL: https://meet-ash.jakeharvey162.workers.dev/
        run: node scripts/pair-ci-desktop.mjs
      - name: Generate two production-style products
        run: python scripts/builder-pro-quality.py
      - name: Audit generated products visually
        run: node scripts/builder-visual-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ash-builder-pro-quality
          path: |
            builder-acceptance/builder-report.json
            builder-acceptance/visual-report.json
            builder-acceptance/*-desktop.png
            builder-acceptance/*-mobile.png
          if-no-files-found: warn
