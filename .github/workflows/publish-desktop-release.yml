name: Publish Desktop Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version without the v prefix, for example 0.3.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must look like 0.3.0 or 0.3.0-beta.1"
            exit 1
          fi
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists"
            exit 1
          fi

      - name: Create release tag from main
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Ash Desktop v$VERSION"
          git push origin "v$VERSION"

      - name: Explain next step
        run: |
          echo "Tag created. The Windows Desktop Release workflow will build, test, checksum and publish the installer automatically."
